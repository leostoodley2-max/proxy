<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Admin</title>
  <style>
    html { background: #16161f; color: #e4e2ee; font: 15px/1.5 system-ui, sans-serif; }
    body { max-width: 980px; margin: 0 auto; padding: 24px 18px 60px; }
    h1 { font-size: 22px; margin: 0 0 16px; } h2 { font-size: 17px; margin: 28px 0 10px; }
    section, form { background: #20202c; border: 1px solid #34344a; border-radius: 12px; padding: 16px; }
    label { display: inline-grid; gap: 4px; margin: 0 12px 10px 0; font-size: 13px; color: #b5b2c6; }
    input { background: #11111a; color: inherit; border: 1px solid #3d3d55; border-radius: 8px; padding: 8px 10px; font: inherit; }
    button { background: #a6324b; color: #fff; border: 0; border-radius: 8px; padding: 9px 16px; font: inherit; font-weight: 600; cursor: pointer; }
    button.secondary { background: #34344a; }
    table { width: 100%; border-collapse: collapse; font-size: 14px; }
    th, td { text-align: left; padding: 7px 8px; border-bottom: 1px solid #2c2c3e; }
    th { color: #9d9ab0; font-weight: 600; }
    code { font: 14px ui-monospace, monospace; background: #11111a; padding: 2px 6px; border-radius: 5px; }
    .new-codes { margin-top: 12px; font: 16px ui-monospace, monospace; white-space: pre-wrap; }
    .error { color: #ff7b8a; } .muted { color: #8f8ca3; }
  </style>
</head>
<body>
  <h1>Admin</h1>
  <form id="login">
    <label>Admin password<input id="password" type="password" autocomplete="current-password" required></label>
    <button>Open</button>
    <p id="login-error" class="error" hidden></p>
  </form>

  <div id="panel" hidden>
    <h2>Make top-up codes</h2>
    <form id="make">
      <label>GB per code<input id="gb" type="number" min="0.1" max="1000" step="0.1" value="4" required></label>
      <label>How many codes<input id="count" type="number" min="1" max="50" value="1" required></label>
      <label>Note (who / what for)<input id="note" maxlength="100" placeholder="e.g. Sam, £1 cash"></label>
      <button>Make codes</button>
      <p class="muted" id="charge"></p>
      <div id="new-codes" class="new-codes"></div>
    </form>

    <h2>Give data to a user</h2>
    <form id="credit">
      <label>Username<input id="credit-user" required></label>
      <label>GB to add (negative removes)<input id="credit-gb" type="number" step="0.1" required></label>
      <button>Add</button>
      <span id="credit-result"></span>
    </form>

    <h2>Users <button class="secondary" type="button" id="reload">Refresh</button></h2>
    <section><table id="users"></table></section>

    <h2>Codes</h2>
    <section><table id="codes"></table></section>
  </div>

  <script>
    "use strict";
    const $ = (id) => document.getElementById(id);
    const GB = 1e9;
    const gb = (b) => (b / GB).toFixed(2);
    const when = (t) => t ? new Date(t).toLocaleString() : "";
    let password = sessionStorage.getItem("orbit.admin") || "";

    async function api(path, body) {
      const res = await fetch("/api/admin/" + path, {
        method: body ? "POST" : "GET",
        headers: { "x-admin-password": password, ...(body ? { "Content-Type": "application/json" } : {}) },
        body: body ? JSON.stringify(body) : undefined,
      });
      const data = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(data.error || "HTTP " + res.status);
      return data;
    }
    function table(el, head, rows) {
      el.replaceChildren();
      const tr = el.insertRow();
      for (const h of head) { const th = document.createElement("th"); th.textContent = h; tr.append(th); }
      for (const row of rows) {
        const r = el.insertRow();
        for (const cell of row) r.insertCell().textContent = cell;
      }
    }
    async function load() {
      const data = await api("overview");
      table($("users"), ["User", "Data left", "Used", "Joined"],
        data.users.map((u) => [u.username, gb(u.balance_bytes) + " GB", gb(u.used_bytes) + " GB", when(u.created_at)]));
      table($("codes"), ["Code", "GB", "Note", "Made", "Used by", "Used"],
        data.codes.map((c) => [c.code, gb(c.bytes), c.note || "", when(c.created_at), c.redeemed_by_name || (c.redeemed_at ? "(deleted user)" : "not used"), when(c.redeemed_at)]));
    }
    async function open() {
      try {
        await load();
        sessionStorage.setItem("orbit.admin", password);
        $("login").hidden = true;
        $("panel").hidden = false;
      } catch (e) {
        $("login-error").textContent = e.message;
        $("login-error").hidden = false;
      }
    }
    function updateCharge() {
      const total = Number($("gb").value) * Number($("count").value);
      $("charge").textContent = "At 25p per GB, charge £" + (Number($("gb").value) * 0.25).toFixed(2) + " per code" +
        (Number($("count").value) > 1 ? " (" + total + " GB in total)" : "") + ".";
    }
    $("login").addEventListener("submit", (e) => { e.preventDefault(); password = $("password").value; open(); });
    $("make").addEventListener("submit", async (e) => {
      e.preventDefault();
      try {
        const data = await api("codes", { gb: Number($("gb").value), count: Number($("count").value), note: $("note").value });
        $("new-codes").textContent = data.codes.join("\n");
        load();
      } catch (err) { $("new-codes").textContent = err.message; }
    });
    $("credit").addEventListener("submit", async (e) => {
      e.preventDefault();
      try {
        const data = await api("credit", { username: $("credit-user").value, gb: Number($("credit-gb").value) });
        $("credit-result").textContent = data.user.username + " now has " + gb(data.user.balanceBytes) + " GB.";
        load();
      } catch (err) { $("credit-result").textContent = err.message; }
    });
    $("gb").addEventListener("input", updateCharge);
    $("count").addEventListener("input", updateCharge);
    $("reload").addEventListener("click", load);
    updateCharge();
    if (password) open();
  </script>
</body>
</html>
