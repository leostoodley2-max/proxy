<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Starting…</title>
  <style>
    html, body { height: 100%; margin: 0; background: #1a1a2e; color: #c9c9d9; font: 16px system-ui, sans-serif; }
    body { display: grid; place-items: center; text-align: center; padding: 0 24px; box-sizing: border-box; }
    button { margin-top: 12px; padding: 8px 18px; border: 0; border-radius: 8px; background: #c97da0; color: #1a1a2e; font: inherit; font-weight: 600; cursor: pointer; }
  </style>
</head>
<body>
  <div>
    <p id="msg">Starting the proxy…</p>
    <button id="action" type="button" hidden></button>
  </div>
  <script>
    // Shown inside a mini-browser tab when a page there didn't go through the
    // service worker: the server sends it for stray /study/ (proxied) requests, and
    // browser.html redirects here if the app loads inside one of its own tabs.
    //
    // Recovery escalates, each step rate-limited so it can never loop:
    //   1. reload this tab (the worker may just not have been ready yet),
    //   2. reload the whole app, so the worker takes control of it (tabs are
    //      saved and come back),
    //   3. remove the service worker and reload, which reinstalls it fresh,
    //   4. only then ask the user, with a button that does step 3 again.
    (async () => {
      const $msg = document.getElementById("msg");
      const $action = document.getElementById("action");
      const show = (text, label, onclick) => {
        $msg.textContent = text;
        $action.hidden = !label;
        if (label) { $action.textContent = label; $action.onclick = onclick; }
      };

      // The window running the mini-browser (null if this isn't one of its tabs).
      let app = null;
      try {
        if (window.parent !== window && window.parent.Engine) app = window.parent;
      } catch (e) {}
      if (!app) {
        location.replace("/"); // opened on its own: the revision front page
        return;
      }

      const store = {
        get(key) { try { return JSON.parse(sessionStorage.getItem(key)) || {}; } catch (e) { return {}; } },
        set(key, value) { try { sessionStorage.setItem(key, JSON.stringify(value)); } catch (e) {} },
      };
      // True (and remembered) if `key` hasn't been used within `ms`.
      const allowed = (key, ms) => {
        if (Date.now() - (store.get(key).at || 0) < ms) return false;
        store.set(key, { at: Date.now() });
        return true;
      };
      const reloadApp = () => {
        show("Restarting the proxy…");
        app.location.reload();
      };
      const resetWorker = async () => {
        show("Restarting the proxy…");
        try {
          const regs = await app.navigator.serviceWorker.getRegistrations();
          await Promise.all(regs.map((r) => r.unregister()));
        } catch (e) {}
        app.location.reload();
      };
      const escalate = () => {
        if (allowed("orbit.wait.app-reload", 30000)) return reloadApp();
        if (allowed("orbit.wait.reset", 5 * 60000)) return resetWorker();
        show("The proxy couldn't start.", "Try again", resetWorker);
      };

      if (!("serviceWorker" in navigator)) {
        show("This browser can't run the proxy (service workers are unavailable).");
        return;
      }
      // The app itself loaded in this tab: the link pointed somewhere the
      // proxy couldn't rewrite. Reloading won't change that.
      if (!location.pathname.startsWith("/study/")) {
        show("This link couldn't be opened through the proxy.", "Go back", () => history.back());
        return;
      }

      // Tab navigations only reach the worker when it controls the app page
      // (the app waits for that before opening tabs), so if it doesn't,
      // reloading this tab alone can't help.
      if (!app.navigator.serviceWorker.controller) return escalate();

      const timeout = (ms) => new Promise((r) => setTimeout(r, ms));
      await Promise.race([navigator.serviceWorker.ready, timeout(10000)]).catch(() => {});

      const key = "orbit.wait:" + location.pathname + location.search;
      const state = store.get(key);
      const tries = Date.now() - (state.at || 0) < 60000 ? state.n || 0 : 0;
      if (tries >= 3) {
        store.set(key, {});
        return escalate();
      }
      store.set(key, { n: tries + 1, at: Date.now() });
      await timeout(400 * (tries + 1));
      location.reload();
    })();
  </script>
</body>
</html>
