# fly.toml app configuration file generated for revisionhelper on 2026-11-26T16:43:50Z
#
# See https://docs.fly.io/reference/configuration for information about how to use this file.
#

app = 'revisionhelper'
primary_region = 'lhr'

[build]

[http_service]
  internal_port = 8080
  force_https = true
  # Keep one machine always running so the SQLite database (accounts, balances,
  # saved sign-ins) is not wiped when the machine would otherwise stop on idle.
  # Note: without a persistent volume the database still resets on each deploy.
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
